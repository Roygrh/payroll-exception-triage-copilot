[project]
name = "payroll-triage-copilot"
version = "0.1.0"
description = "Backend for the Payroll Exception Triage Copilot: rule parameters, corpus rendering, synthetic data generation, evaluation manifest (Iteration 1)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "jinja2>=3.1",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.3",
    "pgvector>=0.5",
    "anthropic>=1.0",
    "fastembed>=0.9",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "httpx>=0.28",
]

[project.scripts]
ptc = "payroll_triage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payroll_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
